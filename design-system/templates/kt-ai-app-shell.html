<!-- ПРЕФИКС РАЗВЁРТЫВАНИЯ. Статика кита адресуется от корня ПРИЛОЖЕНИЯ, а не
     от корня сайта: под префиксом (/cons, /dkks) файлы лежат за ним, и путь
     «/design-system/…» уводит запрос в корень домена — 404, страница без
     стилей и мёртвый орб. Префикс — одно свойство развёртывания, поэтому и
     место у него одно: атрибут data-kt-ai-base на <html>. Папка статики —
     data-kt-ai-static (по умолчанию /design-system, как было).

       <html lang="ru" data-theme="light" data-kt-ai-base="/cons">

     Теги пишет скрипт, а не разметка: адрес уже разобранного <link> изменить
     нельзя — браузер начинает грузить его сразу, и под префиксом это был бы
     гарантированный 404 перед правильным запросом. -->
<script data-kt-ai-base-resolver>
(function () {
  var корень = document.documentElement;
  function норм(значение) {
    значение = (значение || "").trim();
    if (!значение || значение === "/") return "";
    if (значение.charAt(0) !== "/") значение = "/" + значение;
    return значение.replace(/\/+$/, "");
  }
  var база = норм(корень.getAttribute("data-kt-ai-base"));
  var папка = норм(корень.getAttribute("data-kt-ai-static")) || "/design-system";
  window.ktAiBase = база;
  window.ktAiAsset = function (имя) {
    return /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(имя) ? имя : база + папка + "/" + имя;
  };
})();
</script>
<script data-kt-ai-boot="css">
["kt-ai-tokens.css", "kt-ai-components.css"].forEach(function (файл) {
  var ссылка = document.createElement("link");
  ссылка.rel = "stylesheet";
  ссылка.href = window.ktAiAsset(файл);
  document.head.appendChild(ссылка);
});
</script>
<!-- ============================================================
  KT AI App Shell – boilerplate типового enterprise SaaS.
  Гидрируется из JSON-конфига (тег script#kt-app-config в body) –
  его генерирует дизайнер-LLM AI Interviewer по brief владельца.
  Кликабельность встроена: поиск, фильтр статусов, drawer по клику
  на ряд, контрольное действие с подтверждением, bulk-select,
  AI-панель с подсказками, переключатель темы, ⌘K – фокус поиска.
  Схема конфига – см. демо ниже (все ключи опциональны, кроме
  product/table). Канон: ../docs/DESIGN.md · ../docs/PRODUCT_CONTRACT.md · product.schema.json
============================================================ -->
<style>
@layer product {
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  .shell-topbar-burger { display: none; }
  @media (max-width: 831.98px) { .shell-topbar-burger { display: inline-flex; } }
  /* Sidebar: верх – лого + имя решения + toggle; низ – сервисные ряды (Attio-паттерн) */
  .sb-top { display: flex; align-items: center; gap: var(--kt-ai-space-3); padding: 2px 4px 12px; }
  .sb-top img { width: 28px; height: 28px; border-radius: var(--kt-ai-radius-xl); flex-shrink: 0; }
  .sb-top .nm { font-weight: var(--kt-ai-weight-semibold); font-size: var(--kt-ai-text-sm); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .sb-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
  .sb-bottom .badge { margin-left: auto; font-family: var(--kt-ai-font-mono); font-size: var(--kt-ai-text-2xs); background: var(--kt-ai-primary-subtle); color: var(--kt-ai-primary); border-radius: var(--kt-ai-radius-full); padding: 0 6px; }
  /* Низ сайдбара: тур-карточка + утилиты (Помощь, Отзыв) — паттерн ElevenLabs */
  .sb-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: var(--kt-ai-space-4); }
  .sb-bottom button { background: none; border: none; font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
  .sb-bottom .sb-tour { display: flex; align-items: flex-start; gap: var(--kt-ai-space-4); padding: var(--kt-ai-space-4); margin-bottom: var(--kt-ai-space-3); border: 1px solid var(--kt-ai-border); border-radius: var(--kt-ai-radius-xl); background: var(--kt-ai-bg-elevated); transition: background var(--kt-ai-dur-fast) var(--kt-ai-ease-standard); }
  .sb-bottom .sb-tour:hover { background: var(--kt-ai-bg-soft); }
  .sb-tour .ic { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0; border-radius: var(--kt-ai-radius-lg); background: var(--kt-ai-primary-subtle); color: var(--kt-ai-primary); }
  .sb-tour .tx { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sb-tour .tx strong { font-size: var(--kt-ai-text-sm); font-weight: var(--kt-ai-weight-semibold); color: var(--kt-ai-fg); }
  .sb-tour .tx span { font-size: var(--kt-ai-text-xs); color: var(--kt-ai-fg-muted); }
  /* Политика рейла ДС (kt-ai-components.css, @media max-width 1023.98px) сюда
     не дотягивается: компоненты лежат в @layer, а этот блок — беcслойный, и
     беcслойное правило побеждает слоёное независимо от специфичности. Поэтому
     свою часть рейла app-shell закрывает сам: в 52px от блока тура остаётся
     иконка, подпись убирается. */
  /* Диапазон задан С ДВУХ сторон: ниже 832px сайдбар — выдвижная панель во всю
     ширину, и место под подпись там есть. Без нижней границы блок доставал до
     телефона и оставлял от карточки тура одну иконку в панели на 232px — тот же
     дефект, что был в политике рейла самой ДС (закрыт в 6.4.0). */
  @media (min-width: 832px) and (max-width: 1023.98px) {
    .sb-bottom .sb-tour { justify-content: center; padding: var(--kt-ai-space-3); border: 0; background: none; }
    .sb-tour .tx { display: none; }
  }
  .sb-util[data-on="true"] { color: var(--kt-ai-primary); background: var(--kt-ai-primary-subtle); }
  .kt-ai-shell[data-rail="true"] .sb-tour { justify-content: center; padding: var(--kt-ai-space-3); }
  .kt-ai-shell[data-rail="true"] .sb-tour .tx { display: none; }
  /* Онбординг-карусель (первый вход) */
  .onb-card { position: relative; width: 420px; max-width: calc(100vw - 32px); background: var(--kt-ai-bg-elevated); border: 1px solid var(--kt-ai-border); border-radius: var(--kt-ai-radius-3xl); box-shadow: var(--kt-ai-shadow-lg); padding: var(--kt-ai-space-8); text-align: center; }
  .onb-x { position: absolute; top: var(--kt-ai-space-4); right: var(--kt-ai-space-4); }
  .onb-ic { width: 56px; height: 56px; margin: 0 auto var(--kt-ai-space-6); display: grid; place-items: center; border-radius: var(--kt-ai-radius-2xl); background: var(--kt-ai-primary-subtle); color: var(--kt-ai-primary); }
  .onb-ic .kt-icon { width: 26px; height: 26px; }
  .onb-title { font-size: var(--kt-ai-text-xl); font-weight: var(--kt-ai-weight-semibold); margin-bottom: var(--kt-ai-space-4); }
  .onb-text { font-size: var(--kt-ai-text-sm); color: var(--kt-ai-fg-muted); line-height: var(--kt-ai-leading-normal); margin-bottom: var(--kt-ai-space-7); }
  .onb-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--kt-ai-space-5); }
  .onb-dots { display: flex; gap: 6px; }
  .onb-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--kt-ai-border-strong); transition: background var(--kt-ai-dur-fast), width var(--kt-ai-dur-fast); }
  .onb-dots span.on { background: var(--kt-ai-primary); width: 18px; border-radius: 3px; }
  .onb-btns { display: flex; gap: var(--kt-ai-space-3); }
  .menu-up .kt-ai-menu { top: auto; bottom: calc(100% + 4px); right: auto; left: 0; }
  /* Ручной rail-режим (toggle в sb-top) */
  .kt-ai-shell[data-rail="true"] { grid-template-columns: var(--kt-ai-sidebar-collapsed-width) minmax(0, 1fr); }
  .kt-ai-shell[data-rail="true"] .nav-label, .kt-ai-shell[data-rail="true"] .kt-ai-nav-item .count,
  .kt-ai-shell[data-rail="true"] .sb-top .nm, .kt-ai-shell[data-rail="true"] .sb-bottom .badge { display: none; }
  .kt-ai-shell[data-rail="true"] .kt-ai-nav-item { justify-content: center; padding: 0; }
  .kt-ai-shell[data-rail="true"] .sb-top { flex-direction: column; gap: var(--kt-ai-space-3); padding-left: 0; padding-right: 0; }
  /* Төре-орб: кнопка ассистента в топбаре рядом с поиском */
  .topbar-ai {
    display: inline-flex; align-items: center; gap: var(--kt-ai-space-2); flex-shrink: 0;
    height: 32px; padding: 0 var(--kt-ai-space-4); border-radius: var(--kt-ai-radius-full);
    border: 1px solid var(--kt-ai-border-strong); background: var(--kt-ai-bg-elevated); color: var(--kt-ai-fg);
    cursor: pointer; font-size: var(--kt-ai-text-sm); font-weight: var(--kt-ai-weight-medium);
    transition: background var(--kt-ai-dur-fast);
  }
  .topbar-ai:hover { background: var(--kt-ai-bg-hover); }
  .topbar-ai .orb { width: 16px; height: 16px; border-radius: 50%; background: var(--kt-ai-ai-orb); flex-shrink: 0; }
  @media (max-width: 639.98px) { .topbar-ai { padding: 0; width: 32px; justify-content: center; } .topbar-ai .ai-label { display: none; } }
  /* Топбар: заголовок страницы слева */
  .topbar-title { display: flex; align-items: baseline; gap: var(--kt-ai-space-4); min-width: 0; }
  .topbar-title .t { font-size: var(--kt-ai-text-lg); font-weight: var(--kt-ai-weight-semibold); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-title .sub { font-size: var(--kt-ai-text-xs); color: var(--kt-ai-fg-muted); white-space: nowrap; }
  @media (max-width: 639.98px) { .topbar-title .sub { display: none; } }
  /* :not([data-compact]) — чтобы потолок шапки не перебивал компактный вариант:
     у него своя ширина, и она меньше. */
  .kt-ai-topbar .kt-ai-search-field:not([data-compact="true"]) { max-width: 240px; }
  @media (max-width: 767.98px) { .kt-ai-topbar .kt-ai-search-field:not([data-compact="true"]) { max-width: 176px; } }
  /* Рабочая область: больше воздуха сверху (как в React-ките) */
  #view { width: 100%; max-width: var(--kt-ai-content-table); margin-inline: auto; padding: var(--kt-ai-stack-region) var(--kt-ai-stack-region) var(--kt-ai-space-11); }
  @media (max-width: 639.98px) { #view { padding: var(--kt-ai-stack-group) var(--kt-ai-space-6) var(--kt-ai-space-10); } }
  /* Hero-заголовок страницы: лого + крупное имя продукта + подпись (паритет с React KTAIShell) */
  .page-hero { display: flex; align-items: flex-start; gap: var(--kt-ai-space-6); margin-bottom: var(--kt-ai-stack-group); }
  .page-hero .ph-text { flex: 1; min-width: 0; }
  .page-hero h1 { margin: 0; font-size: var(--kt-ai-text-2xl); font-weight: var(--kt-ai-weight-semibold); letter-spacing: -.01em; line-height: 1.15; }
  .page-hero .sub { margin-top: var(--kt-ai-space-3); font-size: var(--kt-ai-text-md); color: var(--kt-ai-fg-muted); }
  .page-hero .ph-action { flex-shrink: 0; }
  @media (max-width: 639.98px) { .page-hero { flex-direction: column; gap: var(--kt-ai-space-5); } .page-hero h1 { font-size: var(--kt-ai-text-2xl); } }
  .topbar-crumb { display: flex; align-items: center; gap: var(--kt-ai-space-3); min-width: 0; font-size: var(--kt-ai-text-sm); color: var(--kt-ai-fg-muted); }

  /* Сетка сервисных рядов внизу: единый слот 20px под иконку/аватар – подписи на одной оси */
  .sb-bottom .kt-ai-nav-item > .kt-icon { flex: 0 0 20px; }
  .sb-bottom .kt-ai-avatar { width: 20px; height: 20px; font-size: 8px; flex: 0 0 20px; }
  .sb-bottom > div:last-child { padding: var(--kt-ai-space-3) var(--kt-ai-space-4) 0; }

  .case-steps { margin-bottom: var(--kt-ai-space-6); overflow-x: auto; padding-bottom: 2px; }
  .case-file { margin-top: var(--kt-ai-space-4); }

  .guide-steps .gs .n { width: 20px; height: 20px; border-radius: 50%; background: var(--kt-ai-primary-subtle); color: var(--kt-ai-primary); font-size: var(--kt-ai-text-2xs); font-weight: var(--kt-ai-weight-bold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }

  .kt-ai-topbar .kt-ai-menu { right: 0; left: auto; top: calc(100% + 6px); }
  /* Карточка кейса: разделы «что сделал агент» / «решение человека» (ElevenLabs detail) */
  .drawer-sec { padding: var(--kt-ai-space-6) 0; border-top: 1px solid var(--kt-ai-divider); }

  .agent-summary { margin: var(--kt-ai-space-4) 0; font-size: var(--kt-ai-text-sm); color: var(--kt-ai-fg-muted); line-height: var(--kt-ai-leading-normal); }
  .agent-signal { display: flex; gap: var(--kt-ai-space-4); align-items: flex-start; padding: var(--kt-ai-space-3) 0; font-size: var(--kt-ai-text-sm); }
  .agent-signal svg { color: var(--kt-ai-fg-faint); flex-shrink: 0; margin-top: 2px; }
  .rec-box { display: flex; flex-direction: column; background: var(--kt-ai-primary-subtle); border-radius: var(--kt-ai-radius-2xl); padding: var(--kt-ai-space-5); font-size: var(--kt-ai-text-sm); margin-top: var(--kt-ai-space-4); }

  .cell-sub { font-size: var(--kt-ai-text-2xs); color: var(--kt-ai-fg-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-act { text-align: right; }
  .row-kebab { opacity: 0; transition: opacity var(--kt-ai-dur-fast); }
  .kt-ai-table tbody tr:hover .row-kebab { opacity: 1; }
}
</style>

<script>
"use strict";
/* KT AI App Shell runtime: гидрация конфига + типовые взаимодействия. */
const CFG = JSON.parse(document.getElementById("kt-app-config").textContent);
// морфология казахских/русских строк хрупкая → продукт может задать createLabel явно
const createLabel = (CFG.product && CFG.product.createLabel) || ("Новый " + ((CFG.product && CFG.product.entity) || "объект"));
const LOGO = (document.querySelector(".sb-top img") || {}).src || "";
const S = {};
let state = { navIndex: 0, query: "", statusFilter: "", selected: new Set(), openRow: -1 };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Ключ статуса или колонки, уезжающий в inline-обработчик: onclick="S.sort('…')".
// esc() тут не помощник — он готовит текст для РАЗМЕТКИ, а внутри атрибута
// лежит ещё и JS-строка. Ключ с апострофом ломал бы обработчик молча: кнопка
// есть, нажатие не делает ничего. Ключи приходят из контракта продукта, схема
// их вид не ограничивает.
const escJs = s => esc(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
const statuses = CFG.statuses || {};
const rows = (CFG.table && CFG.table.rows || []).map((r, i) => Object.assign({ _i: i }, r));
const cols = CFG.table && CFG.table.columns || [];
const statusCol = (cols.find(c => c.type === "status") || {}).key;
const workflowStatusKeys = statusCol ? Array.from(new Set(rows.map(r => r[statusCol]).filter(v => v != null && v !== "").map(String))) : [];
const filterKeys = (Array.isArray(CFG.filterKeys) && CFG.filterKeys.length ? CFG.filterKeys.map(String) : workflowStatusKeys).filter(k => statuses[k]).slice(0, 4);

function statusTag(key) {
  const st = statuses[key] || { label: key, tone: "info" };
  return '<span class="kt-ai-status-pill" data-status="' + esc(st.tone) + '">' + esc(st.label) + "</span>";
}
function confCell(v) {
  const n = parseInt(String(v == null ? "" : v).replace(/[^\d]/g, ""), 10);
  const pct = isNaN(n) ? 0 : Math.max(0, Math.min(100, n));
  const tone = pct >= 80 ? "ok" : pct >= 60 ? "warn" : "risk";
  return '<span class="conf-cell" data-tone="' + tone + '"><span class="conf-bar"><span style="width:' + pct + '%"></span></span>' +
    '<span class="conf-pct">' + esc(v == null || v === "" ? "—" : v) + "</span></span>";
}
function cellHtml(row, col) {
  const v = row[col.key];
  if (col.type === "status") return statusTag(v);
  if (col.type === "confidence") return confCell(v);
  if (col.type === "num") return '<span class="kt-ai-num">' + esc(v) + "</span>";
  if (col.type === "date") { const m = String(v).match(/(\d{4})-(\d{2})-(\d{2})/); return '<span class="kt-ai-num" style="font-size:var(--kt-ai-text-xs)">' + esc(m ? m[3] + "." + m[2] : v) + "</span>"; }
  // двухстрочная entity-ячейка (ElevenLabs): значение + muted-подзаголовок из col.sub
  if (col.sub && row[col.sub] != null && row[col.sub] !== "") return '<div class="cell-title">' + esc(v) + '</div><div class="cell-sub">' + esc(row[col.sub]) + "</div>";
  return esc(v);
}

// Универсальный диапазон дат: фильтрует строки (→ таблица И график) по dateKey графика.
function parseDate(s) { const m = String(s == null ? "" : s).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function dateBounds() {
  const key = (CFG.chart || {}).dateKey;
  if (!key) return null;
  const ds = rows.map(r => parseDate(r[key])).filter(Boolean);
  if (!ds.length) return null;
  const end = new Date(Math.max(...ds.map(d => d.getTime())));
  const days = state.dateRange == null ? 30 : state.dateRange;
  if (!days) return { start: new Date(Math.min(...ds.map(d => d.getTime()))), end, days: 0, key };
  const start = new Date(end); start.setDate(start.getDate() - (days - 1));
  return { start, end, days, key };
}
function visibleRows() {
  const q = state.query.toLowerCase();
  const db = dateBounds();
  let out = rows.filter(r => {
    if (db) { const d = parseDate(r[db.key]); if (d && (d < db.start || d > db.end)) return false; }
    if (state.statusFilter && r[statusCol] !== state.statusFilter) return false;
    if (!q) return true;
    return cols.some(c => String(r[c.key] ?? "").toLowerCase().includes(q));
  });
  const s = state.sort;
  if (s && s.key) {
    const col = cols.find(c => c.key === s.key), num = col && col.type === "num";
    out = out.slice().sort((a, b) => {
      let av = a[s.key], bv = b[s.key];
      if (num) { av = parseFloat(String(av).replace(/[^\d.-]/g, "")) || 0; bv = parseFloat(String(bv).replace(/[^\d.-]/g, "")) || 0; }
      else { av = String(av ?? "").toLowerCase(); bv = String(bv ?? "").toLowerCase(); }
      return av < bv ? (s.dir === "asc" ? -1 : 1) : av > bv ? (s.dir === "asc" ? 1 : -1) : 0;
    });
  }
  return out;
}
S.sort = key => {
  const s = state.sort;
  state.sort = (s && s.key === key) ? (s.dir === "asc" ? { key, dir: "desc" } : null) : { key, dir: "asc" };
  state.page = 1;

// Сводный bar-chart над таблицей (видео Kole Jain: «data drives the form»).
// chart.groupBy=<колонка> → бары считаются из фильтрованных строк и адаптируются к выбранному табу.
function renderChart(ch, rowsForChart) {
  if (!ch) return "";
  let data = ch.bars || [], total = ch.total, cat = false;
  if (ch.bucket === "day" && ch.dateKey) {
    // раскат по дням за выбранный диапазон; rowsForChart уже отфильтрованы (диапазон+таб+поиск)
    const db = dateBounds(), buckets = {};
    if (db) for (let d = new Date(db.start); d <= db.end; d.setDate(d.getDate() + 1)) buckets[d.toISOString().slice(0, 10)] = 0;
    (rowsForChart || []).forEach(r => { const d = parseDate(r[ch.dateKey]); if (d) { const k = d.toISOString().slice(0, 10); if (k in buckets) buckets[k]++; } });
    const keys = Object.keys(buckets).sort();
    data = keys.map(k => ({ label: String(+k.slice(8, 10)), value: buckets[k] }));
    total = String((rowsForChart || []).length);
  } else if (ch.groupBy) {
    const g = {};
    (rowsForChart || []).forEach(r => { const v = r[ch.groupBy]; const k = (v == null || v === "") ? "—" : String(v); g[k] = (g[k] || 0) + 1; });
    data = Object.keys(g).map(k => ({ label: k, value: g[k] }));
    total = String((rowsForChart || []).length);
    cat = true;
  }
  if (!data.length) return "";
  const colorVar = ({ blue: "--kt-ai-chart-blue", green: "--kt-ai-chart-green", orange: "--kt-ai-chart-orange", salmon: "--kt-ai-chart-salmon", pink: "--kt-ai-chart-pink", primary: "--kt-ai-primary" })[ch.color] || "--kt-ai-chart-blue";
  const max = Math.max(1, ...data.map(b => +b.value || 0));
  const bars = data.map(b => '<div class="cc-bar"' + tipAttr(b) + '><i style="height:' + Math.round((+b.value || 0) / max * 100) + '%"></i></div>').join("");
  let axis;
  if (cat || data.length <= 8) {
    axis = '<div class="cc-axis cc-axis-cat">' + data.map(b => '<span title="' + esc(b.label || "") + '">' + esc(b.label || "") + "</span>").join("") + "</div>";
  } else {
    const n = data.length, step = Math.max(1, Math.ceil(n / 7));
    axis = '<div class="cc-axis">' + data.map((b, i) => (i % step === 0 || i === n - 1) ? "<span>" + esc(b.label || "") + "</span>" : "").filter(Boolean).join("") + "</div>";
  }
  return '<section class="kt-ai-chart-card" style="--cc-color:var(' + colorVar + ')">' +
    '<div class="cc-head"><div><div class="cc-title">' + esc(ch.title || "") + "</div>" +
    (total ? '<div class="cc-total"><span class="num">' + esc(total) + "</span>" + (ch.unit ? '<span class="unit">' + esc(ch.unit) + "</span>" : "") + "</div>" : "") + "</div>" +
    (ch.link ? '<button class="cc-link" type="button" onclick="toast(\'' + esc(ch.link) + " – заглушка прототипа','')\">" + esc(ch.link) + ' →</button>' : "") + "</div>" +
    '<div class="cc-bars">' + bars + "</div>" + axis + "</section>";
}

    '<button class="kt-ai-btn" data-size="sm" onclick="S.bulkApprove()">' + esc(sc.control || "Подтвердить") + "</button>" +
    '<button class="kt-ai-btn" data-size="sm" data-variant="ghost" onclick="S.clearSel()">Снять выбор</button></div>';

  if (!vis.length) {
    // первый запуск (данных ещё нет) отличаем от «фильтр ничего не нашёл»
    const zeroData = rows.length === 0;
    const icon = zeroData
      ? '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 16h6"/>'
      : '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>';
    html += '<div class="kt-ai-empty"><div class="icon-spot"><svg class="kt-icon kt-icon-lg" viewBox="0 0 24 24">' + icon + '</svg></div>' +
      '<span class="title">' + (zeroData ? "Пока нет записей" : "Ничего не найдено") + '</span>' +
      '<span>' + (zeroData ? "Здесь появятся объекты, как только агент их обработает" : "Измените поиск или фильтр статуса") + '</span></div></div>';
  } else {
    // Ширина колонки = по содержимому (из ВСЕХ строк → стабильно при фильтрах), с клампом по типу. column.width — явный override.
    const colw = c => {
      if (c.width) return c.width;
      if (c.type === "num") return "92px";
      if (c.type === "date") return "116px";
      if (c.type === "status") {
        const keys = (c.values && c.values.length) ? c.values : Object.keys(statuses);
        const m = Math.max(7, ...keys.map(k => String((statuses[k] || {}).label || k).length));
        return Math.min(180, Math.round(m * 7.2 + 42)) + "px";
      }
      let m = String(c.label || "").length;
      for (const r of rows) {
        m = Math.max(m, String(r[c.key] == null ? "" : r[c.key]).length);
        if (c.sub) m = Math.max(m, String(r[c.sub] == null ? "" : r[c.sub]).length);
      }
      return Math.min(300, Math.max(88, Math.round(m * 7 + 28))) + "px";
    };
    const kebab = '<svg class="kt-icon kt-icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg>';
    html += '<table class="kt-ai-table" style="table-layout:fixed">' +
      '<colgroup><col style="width:40px">' + cols.map(c => "<col" + (colw(c) ? ' style="width:' + colw(c) + '"' : "") + ">").join("") + '<col style="width:48px"></colgroup>' +
      '<thead><tr><th scope="col"><span class="kt-ai-sr-only">Выбор</span></th>' +
      cols.map(c => {
        const a = c.align || (c.type === "num" ? "right" : "left");   // выравнивание: num по умолчанию справа, column.align — override
        const align = a !== "left" ? ' style="text-align:' + a + '"' : "";
        if (!c.sortable) return '<th scope="col"' + align + ">" + esc(c.label) + "</th>";
        const on = state.sort && state.sort.key === c.key, dir = on ? state.sort.dir : "";
        return '<th scope="col"' + align + (on ? ' aria-sort="' + (dir === "asc" ? "ascending" : "descending") + '"' : "") +
          '><button class="th-sort" type="button" onclick="S.sort(\'' + escJs(c.key) + '\')">' + esc(c.label) +
          '<svg class="kt-icon th-sort-ic" data-dir="' + dir + '"><use href="#' + (on ? "chevronDown" : "arrowUpDown") + '"></use></svg></button></th>';
      }).join("") + '<th scope="col"><span class="kt-ai-sr-only">Действия</span></th>' +
      "</tr></thead><tbody>" +
      pageRows.map(r => '<tr data-dim="' + (statusCol && statuses[r[statusCol]] && statuses[r[statusCol]].dim ? "true" : "false") + '" onclick="S.open(' + r._i + ')" style="cursor:pointer">' +
        '<td class="cell-select" onclick="event.stopPropagation()"><label class="kt-ai-checkbox"><input type="checkbox" ' + (state.selected.has(r._i) ? "checked" : "") + ' onchange="S.sel(' + r._i + ',this.checked)"></label></td>' +
        cols.map(c => { const a = c.align || (c.type === "num" ? "right" : "left"); return '<td data-label="' + esc(c.label) + '"' + (c.type === "num" ? ' class="num"' : "") + (a !== "left" ? ' style="text-align:' + a + '"' : "") + ">" + cellHtml(r, c) + "</td>"; }).join("") +
        '<td class="row-act" onclick="event.stopPropagation()"><button class="kt-ai-icon-button row-kebab" aria-label="Действия" onclick="S.rowMenu(' + r._i + ',event)">' + kebab + "</button></td>" +
        "</tr>").join("") +
      "</tbody></table></div>";
    if (pageCount > 1) {
      let pages = "";
      for (let p = 1; p <= pageCount; p++) pages += '<button class="page-btn" data-active="' + (p === state.page) + '" onclick="S.page(' + p + ')">' + p + "</button>";
      const from = (state.page - 1) * pageSize + 1, to = Math.min(state.page * pageSize, vis.length);
      html += '<div class="table-foot"><span class="kt-ai-meta">' + from + "–" + to + " из " + vis.length + "</span>" +
        '<div class="kt-ai-pagination"><button class="page-btn" ' + (state.page === 1 ? "disabled" : "") + ' aria-label="Назад" onclick="S.page(' + (state.page - 1) + ')">‹</button>' +
        pages + '<button class="page-btn" ' + (state.page === pageCount ? "disabled" : "") + ' aria-label="Вперёд" onclick="S.page(' + (state.page + 1) + ')">›</button></div></div>';
    }
  }
  return html;
}

function renderStub(label) {
  $("pageTitle").textContent = label;
  $("pageSub").textContent = CFG.product.purpose || "";
  return '<div class="kt-ai-card section-stub" style="margin-top:0"><div class="kt-ai-empty">' +
    '<div class="icon-spot"><svg class="kt-icon kt-icon-lg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg></div>' +
    '<span class="title">Раздел обозначен в концепте</span>' +
    '<span>Детализирован будет после подтверждения сценария «' + esc((CFG.scenario || {}).headline || "") + '»</span>' +
    '<button class="kt-ai-btn" data-size="sm" onclick="S.nav(0)">К главному сценарию</button></div></div>';
}

// Документ-артефакт (что продукт ПРОИЗВОДИТ): карточка с иконкой, статусом и кнопкой «Скачать».
function docCard(dd, objName) {
  const fmt = dd.format ? String(dd.format).toUpperCase() : "";
  const sub = [objName, dd.status, fmt].filter(Boolean).map(esc).join(" · ");
  const dlName = (dd.label + (objName ? " — " + objName : "")).replace(/['"]/g, "");
  return '<div class="kt-ai-doc"><span class="doc-ic"><svg class="kt-icon"><use href="#file"></use></svg></span>' +
    '<span class="doc-meta"><span class="doc-name">' + esc(dd.label) + "</span>" +
    (sub ? '<span class="doc-sub">' + sub + "</span>" : "") + "</span>" +
    '<button class="kt-ai-btn" data-size="sm" onclick="S.downloadDoc(\'' + esc(dlName) + '\')"><svg class="kt-icon kt-icon-sm"><use href="#download"></use></svg>Скачать</button></div>';
}
// Секция-коллекция документов одного типа по всем записям (nav.view="documents", nav.docType).
function renderDocs(navItem) {
  const docType = navItem.docType;
  const titleKey = (CFG.drawer && CFG.drawer.titleKey) || (cols[0] && cols[0].key);
  const items = [];
  rows.forEach(r => (Array.isArray(r._docs) ? r._docs : []).forEach(dd => { if (!docType || dd.type === docType) items.push({ dd, name: r[titleKey] }); }));
  if (!items.length) return '<div class="kt-ai-card" style="margin-top:0"><div class="kt-ai-empty">' +
    '<div class="icon-spot"><svg class="kt-icon kt-icon-lg"><use href="#file"></use></svg></div>' +
    '<span class="title">Документов пока нет</span><span>Появятся, когда агент сформирует их по предложениям</span></div></div>';
  return '<div class="kt-ai-doc-list">' + items.map(it => docCard(it.dd, it.name)).join("") + "</div>";
}
S.downloadDoc = name => {
  try {
    const blob = new Blob(["KT AI — прототип\n\n" + name + "\n\nВ продукте здесь будет сформированный документ.\n"], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name.replace(/[^0-9A-Za-zА-Яа-яЁё]+/g, "_").slice(0, 60) + ".txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch (e) {}
  toast("Скачивание: " + name, "ok");
};

// Архетип экрана из реестра archetypes/registry.json (открытый набор).
// Дефолт queue. Если архетип неизвестен/не реализован — подбираем безопасную форму
// по наличию данных, а не ломаем экран: есть секции → custom, есть таблица → queue, иначе → custom.

// document: документ с правками агента по фрагментам (принять/отклонить каждый флаг)
function renderDocument() {
  const doc = CFG.document || {}, sc = CFG.scenario || {};
  $("pageTitle").textContent = sc.headline || doc.title || CFG.product.name;
  $("pageSub").textContent = CFG.product.purpose || "";
  if (!state.fragState) state.fragState = {};
  const frs = Array.isArray(doc.fragments) ? doc.fragments : [];
  const edits = frs.filter(f => f.op && f.op !== "keep").length, flags = frs.filter(f => f.flag).length;
  let h = '<div style="max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:var(--kt-ai-stack-group)">';
  h += bannerHtml();
  h += '<div class="kt-ai-card" style="padding:var(--kt-ai-space-6)"><span class="kt-ai-label">Что сделал агент</span>' +
    '<div style="margin-top:var(--kt-ai-space-3)">' + esc(doc.source ? "Собрал документ: " + doc.source + ". " : "") +
    "Правок: " + edits + ", пометок риска: " + flags + ". Проверьте выделенные фрагменты.</div></div>";
  if (!frs.length) return h + '<div class="kt-ai-empty"><span class="title">Документ пока пуст</span><span>Здесь появится текст с правками агента</span></div></div>';
  h += '<div class="kt-ai-card" style="padding:var(--kt-ai-space-8)"><div class="kt-ai-h2" style="margin-bottom:var(--kt-ai-space-6)">' + esc(doc.title || "Документ") + "</div>";
  h += frs.map((f, i) => {
    const st = state.fragState[i];
    let b = '<div style="margin-bottom:var(--kt-ai-space-6);border-left:2px solid ' + (f.flag ? "var(--kt-ai-status-warn-fg)" : "var(--kt-ai-border)") + ';padding-left:var(--kt-ai-space-5)">';
    if (f.heading) b += '<div class="kt-ai-h3" style="margin-bottom:var(--kt-ai-space-2)">' + esc(f.heading) + "</div>";
    if (f.op === "edit" && f.was) b += '<div class="kt-ai-diff" style="margin-bottom:var(--kt-ai-space-2)"><span class="line" data-op="del">' + esc(f.was) + '</span><span class="line" data-op="add">' + esc(f.text) + "</span></div>";
    else if (f.op === "add") b += '<div class="kt-ai-diff" style="margin-bottom:var(--kt-ai-space-2)"><span class="line" data-op="add">' + esc(f.text) + "</span></div>";
    else if (f.op === "del") b += '<div class="kt-ai-diff" style="margin-bottom:var(--kt-ai-space-2)"><span class="line" data-op="del">' + esc(f.text) + "</span></div>";
    else b += "<div>" + esc(f.text) + "</div>";
    if (f.flag) {
      b += '<div class="kt-ai-banner" data-tone="warn" style="margin-top:var(--kt-ai-space-2)">' + esc(f.flag) + "</div>";
      b += '<div style="display:flex;gap:var(--kt-ai-space-3);margin-top:var(--kt-ai-space-2)">' +
        (st === "ok" ? '<span class="kt-ai-status-pill" data-status="ok">Принято</span>'
          : st === "no" ? '<span class="kt-ai-status-pill" data-status="risk">Отклонено</span>'
          : '<button class="kt-ai-btn" data-size="sm" data-variant="primary" onclick="S.fragOk(' + i + ')">Принять правку</button>' +
            '<button class="kt-ai-btn" data-size="sm" onclick="S.fragNo(' + i + ')">Отклонить</button>') + "</div>";
    }
    return b + "</div>";
  }).join("");
  h += "</div>";
  h += '<div style="display:flex;gap:var(--kt-ai-space-4)">' +
    '<button class="kt-ai-btn" data-variant="primary" onclick="S.customAction()">' + esc(sc.control || "Подтвердить документ") + "</button>" +
    (sc.reject ? '<button class="kt-ai-btn" onclick="S.customAction()">' + esc(sc.reject) + "</button>" : "") + "</div>";
  return h + "</div>";
}
S.fragOk = i => { state.fragState[i] = "ok"; render(); toast("Правка принята", "ok"); };
S.fragNo = i => { state.fragState[i] = "no"; render(); toast("Правка отклонена — фрагмент вернётся к исходному", "warn"); };

// copilot: чат слева + живой артефакт-результат справа

  let chat = '<div class="kt-ai-chat" id="copChat" data-fill="true" role="log" aria-live="polite" aria-label="Диалог с агентом">' + msgHtml("assistant", ai.intro || "Здравствуйте! Опишите, что подготовить.") + "</div>";

    '<span class="kt-ai-status-pill" data-status="ok">Черновик готов</span></div>' +
    '<div class="kt-ai-h3">' + esc(art.title || "") + "</div>" +
    '<div style="white-space:pre-wrap;font-size:var(--kt-ai-text-sm);line-height:1.6;max-height:420px;overflow:auto;border:1px solid var(--kt-ai-border);border-radius:var(--kt-ai-radius-lg);padding:var(--kt-ai-space-5);background:var(--kt-ai-bg-soft)">' + esc(art.preview || "") + "</div>" +
    '<div style="display:flex;gap:var(--kt-ai-space-3)">' +
    (Array.isArray(art.actions) && art.actions.length ? art.actions : [sc.control || "Скачать"]).slice(0, 3).map((a, j) =>
      '<button class="kt-ai-btn" data-size="sm"' + (j === 0 ? ' data-variant="primary"' : "") + ' onclick="S.customAction()">' + esc(a) + "</button>").join("") + "</div></div>";
  let h = '<div class="kt-ai-cols" style="grid-template-columns:minmax(320px,1fr) minmax(320px,1.1fr);align-items:stretch">' +

// wizard: пошаговая заявка с автозаполнением агентом
function renderWizard() {
  const wz = CFG.wizard || {}, sc = CFG.scenario || {};
  $("pageTitle").textContent = sc.headline || CFG.product.name;
  $("pageSub").textContent = CFG.product.purpose || "";
  const steps = Array.isArray(wz.steps) ? wz.steps : [];
  if (state.wizStep == null) state.wizStep = Math.min(Math.max((wz.current || 1) - 1, 0), steps.length - 1);
  const cur = state.wizStep, stp = steps[cur] || { title: "", fields: [] };
  // референс ElevenLabs (publishing flow): вертикальный степпер слева с описаниями, контент справа
  let h = '<div class="kt-ai-cols" style="max-width:860px;margin:0 auto;grid-template-columns:230px minmax(0,1fr);gap:var(--kt-ai-space-9)">';
  h += '<div style="display:flex;flex-direction:column;gap:var(--kt-ai-space-5)">' + steps.map((x, i) => {
    const st = i < cur ? "done" : (i === cur ? "current" : "");
    return '<div class="kt-ai-step-item"' + (st ? ' data-state="' + st + '"' : "") + ' style="align-items:flex-start"><span class="n" style="flex-shrink:0">' + (i < cur ? "✓" : i + 1) + "</span>" +
      '<span><span style="display:block;font-size:var(--kt-ai-text-sm)">' + esc(x.title) + "</span>" +
      (x.desc ? '<span style="display:block;margin-top:2px;font-size:var(--kt-ai-text-2xs);color:var(--kt-ai-fg-faint);line-height:1.4">' + esc(x.desc) + "</span>" : "") + "</span></div>";
  }).join("") + "</div>";
  h += '<div style="display:flex;flex-direction:column;gap:var(--kt-ai-stack-group)">';
  h += bannerHtml();
  h += '<div class="kt-ai-card" style="padding:var(--kt-ai-space-7);display:flex;flex-direction:column;gap:var(--kt-ai-space-5)">' +
    '<div class="kt-ai-h3">' + esc(stp.title) + "</div>" +
    (stp.fields || []).map(f =>
      '<label class="kt-ai-field"><span class="cap" style="display:flex;gap:var(--kt-ai-space-2);align-items:center">' + esc(f.label) +
      (f.prefill ? '<span class="kt-ai-chip" data-ai="true">заполнил агент</span>' : "") + "</span>" +
      '<input class="kt-ai-input" value="' + esc(String(f.value == null ? "" : f.value)) + '">' +
      (f.hint ? '<span class="hint">' + esc(f.hint) + "</span>" : "") + "</label>").join("") + "</div>";
  h += '<div style="display:flex;justify-content:space-between;gap:var(--kt-ai-space-4)">' +
    '<button class="kt-ai-btn"' + (cur === 0 ? " disabled" : "") + ' onclick="S.wizPrev()">‹ Назад</button>' +
    (cur < steps.length - 1
      ? '<button class="kt-ai-btn" data-variant="primary" onclick="S.wizNext()">Далее</button>'
      : '<button class="kt-ai-btn" data-variant="primary" onclick="S.customAction()">' + esc(sc.control || "Отправить заявку") + "</button>") + "</div>";
  h += "</div>";
  return h + "</div>";
}
S.wizPrev = () => { if (state.wizStep > 0) { state.wizStep--; render(); } };
S.wizNext = () => { state.wizStep++; render(); };


// kanban: доска статусов – колонки из CFG.statuses, карточки = строки table.rows (клик открывает drawer)

  }).join("");

// inbox: список + постоянная панель чтения (обращения, письма) – выбранная запись читается справа
function renderInbox() {

// analytics: аналитический разбор – сводка агента, чарты (bar/line/donut на чистом SVG/CSS), выводы с тонами

// переиспользуемый line-чарт (analytics и dashboard): полилиния + область + сетка + подписи оси
function lineChartSvg(pts, o) {
  const W = o.W || 300, H = o.H || 120, color = o.color || "var(--kt-ai-chart-blue)";
  const n = pts.length, x0 = 8, y0 = 12, w = W - 16, hh = H - 36;
  const vals = pts.map(p => +p.value || 0);
  const max = Math.max(1, ...vals), min = Math.min(...vals), span = (max - min) || 1;
  const px = i => x0 + (n > 1 ? i * (w / (n - 1)) : w / 2), py = v => y0 + hh - ((v - min) / span) * hh;
  const line = pts.map((p, i) => (i ? "L" : "M") + px(i).toFixed(1) + " " + py(+p.value || 0).toFixed(1)).join(" ");
  const area = line + " L" + px(n - 1).toFixed(1) + " " + (y0 + hh) + " L" + px(0).toFixed(1) + " " + (y0 + hh) + " Z";
  return '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="' + esc(o.title || "") + '">' +
    [0, .5, 1].map(f => '<line x1="' + x0 + '" y1="' + (y0 + hh * f).toFixed(1) + '" x2="' + (x0 + w) + '" y2="' + (y0 + hh * f).toFixed(1) + '" stroke="var(--kt-ai-border)" stroke-width="1" stroke-dasharray="2 3"/>').join("") +
    '<path d="' + area + '" fill="' + color + '" opacity="0.10"/>' +
    '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round"/>' +
    pts.map((p, i) => '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(+p.value || 0).toFixed(1) + '" r="' + (W > 400 ? 3 : 2.6) + '" fill="' + color + '"' + tipAttr(p) + "></circle>").join("") +
    pts.map((p, i) => { const step = Math.max(1, Math.ceil(n / (W > 400 ? 12 : 7))); if (i % step !== 0 && i !== n - 1) return ""; const anchor = i === 0 ? "start" : i === n - 1 ? "end" : "middle"; return '<text x="' + px(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '" font-size="' + (W > 400 ? 11 : 9) + '" fill="var(--kt-ai-fg-faint)">' + esc(p.label) + "</text>"; }).join("") +
    '<text x="' + (W > 400 ? x0 : x0 + w) + '" y="' + (y0 - 3) + '"' + (W > 400 ? "" : ' text-anchor="end"') + ' font-size="' + (W > 400 ? 11 : 9) + '" fill="var(--kt-ai-fg-faint)">' + esc(String(max)) + (o.unit ? " " + esc(o.unit) : "") + "</text></svg>";
}
const ANALYTICS_PALETTE = ["--kt-ai-chart-blue", "--kt-ai-chart-green", "--kt-ai-chart-orange", "--kt-ai-chart-salmon", "--kt-ai-chart-pink"];
function tipAttr(b) {
  // Подсказка марки. hint приходит от продукта ГОТОВЫМ — ничего не считаем и не
  // форматируем: сервер и браузер округляют по-разному, и разошедшийся формат
  // это разошедшееся число. Без hint показываем то же, что показывал title.
  var v = b && b.hint ? JSON.stringify(b.hint) : ((b && b.label ? b.label + ": " : "") + (b ? b.value : ""));
  return ' data-kt-tip="' + esc(v) + '" tabindex="0"';
}

function analyticsChartCard(ch, idx) {
  const pts = Array.isArray(ch.points) ? ch.points.filter(p => p && p.label != null) : [];
  const vals = pts.map(p => +p.value || 0);
  const max = Math.max(1, ...vals);
  const color = "var(" + (ANALYTICS_PALETTE[idx % ANALYTICS_PALETTE.length]) + ")";
  const toneColor = t => toneFg(t, color);
  let body = "";
  if (ch.type === "line") {
    body = lineChartSvg(pts, { color: color, unit: ch.unit, title: ch.title });
  } else if (ch.type === "donut") {
    const total = vals.reduce((a, b) => a + b, 0) || 1;
    let off = 25, segs = "";
    pts.forEach((p, i) => {
      const share = (+p.value || 0) / total * 100;
      const c = p.tone ? toneColor(p.tone) : "var(" + ANALYTICS_PALETTE[i % ANALYTICS_PALETTE.length] + ")";
      segs += '<circle r="15.9155" cx="21" cy="21" fill="none" stroke="' + c + '" stroke-width="5.5" stroke-dasharray="' + share.toFixed(2) + " " + (100 - share).toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '"' + tipAttr(p) + "></circle>";
      off -= share;
    });
    body = '<div style="display:flex;gap:var(--kt-ai-space-6);align-items:center">' +
      '<svg viewBox="0 0 42 42" style="width:118px;height:118px;flex-shrink:0" role="img" aria-label="' + esc(ch.title) + '">' + segs +
      '<text x="21" y="21.5" text-anchor="middle" dominant-baseline="middle" font-size="8" font-weight="600" fill="var(--kt-ai-fg)">' + esc(ch.total != null ? String(ch.total) : String(total)) + "</text></svg>" +
      '<div style="flex:1;min-width:0">' + pts.map((p, i) => {
        const c = p.tone ? toneColor(p.tone) : "var(" + ANALYTICS_PALETTE[i % ANALYTICS_PALETTE.length] + ")";
        return '<div style="display:flex;align-items:center;gap:var(--kt-ai-space-3);padding:3px 0;font-size:var(--kt-ai-text-xs)">' +
          '<span style="width:9px;height:9px;border-radius:3px;background:' + c + ';flex-shrink:0"></span>' +
          '<span style="flex:1;min-width:0;line-height:1.3">' + esc(p.label) + "</span>" +
          '<span class="kt-ai-num" style="font-weight:600">' + esc(p.value) + "</span>" +
          '<span class="kt-ai-meta" style="width:38px;text-align:right">' + Math.round((+p.value || 0) / total * 100) + "%</span></div>";
      }).join("") + "</div></div>";
  } else {  // bar (горизонтальные полосы: подпись | полоса | значение – читаемее для категорий)
    body = pts.map(p => {
      const c = p.tone ? toneColor(p.tone) : color;
      return '<div class="kt-ai-row-hover" style="display:grid;grid-template-columns:minmax(90px,32%) 1fr 56px;gap:var(--kt-ai-space-3);align-items:center;padding:3px 0;font-size:var(--kt-ai-text-xs)">' +
        '<span style="line-height:1.3">' + esc(p.label) + "</span>" +
        '<span style="height:8px;border-radius:4px;background:var(--kt-ai-bg-soft);overflow:hidden;display:block"><span style="display:block;height:100%;border-radius:4px;width:' + Math.round((+p.value || 0) / max * 100) + "%;background:" + c + '"></span></span>' +
        '<span class="kt-ai-num" style="text-align:right;font-weight:600">' + esc(p.value) + (ch.unit ? ' <span class="kt-ai-meta" style="font-weight:400">' + esc(ch.unit) + "</span>" : "") + "</span></div>";
    }).join("");
  }
  return '<section class="kt-ai-chart-card" style="margin-bottom:0"><div class="cc-head"><div><div class="cc-title">' + esc(ch.title || "") + "</div>" +
    (ch.total != null && ch.type !== "donut" ? '<div class="cc-total"><span class="num">' + esc(ch.total) + "</span>" + (ch.unit ? '<span class="unit">' + esc(ch.unit) + "</span>" : "") + "</div>" : "") + "</div></div>" +
    body + (ch.note ? '<div class="kt-ai-meta" style="margin-top:var(--kt-ai-space-4)">' + esc(ch.note) + "</div>" : "") + "</section>";
}
function renderAnalytics() {
  const an = CFG.analytics || {}, sc = CFG.scenario || {};
  const charts = Array.isArray(an.charts) ? an.charts : [];
  const finds = Array.isArray(an.findings) ? an.findings : [];
  let h = renderHead();

    (an.period ? '<span class="kt-ai-meta">' + esc(an.period) + "</span>" : "") + "</div>" +

  if (charts.length) h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--kt-ai-space-6);margin-top:var(--kt-ai-space-6)">' +

      '<span style="flex:1;min-width:0"><strong>' + esc(f.title) + "</strong>" + (f.detail ? " — " + esc(f.detail) : "") + "</span>" +

// calendar: расписание по датам – события сгруппированы по дням (окна работ, дежурства, сроки)
const CAL_MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const CAL_DAYS = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
function renderCalendar() {
  const cal = CFG.calendar || {};
  const evs = (Array.isArray(cal.events) ? cal.events : []).filter(e => e && e.date && e.title).slice().sort((a, b) => String(a.date + (a.time || "")).localeCompare(String(b.date + (b.time || ""))));
  const byDay = {};
  evs.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  let h = renderHead();
  h += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin:var(--kt-ai-space-6) 0 var(--kt-ai-space-4)"><div class="kt-ai-h3">' + esc(cal.title || "Расписание") + "</div>" +
    (cal.range ? '<span class="kt-ai-meta">' + esc(cal.range) + "</span>" : "") + "</div>";
  h += Object.keys(byDay).sort().map(dk => {
    const m = dk.match(/(\d{4})-(\d{2})-(\d{2})/);
    const dt = m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    const head = dt ? (+m[3]) + " " + CAL_MONTHS[dt.getMonth()] + ", " + CAL_DAYS[dt.getDay()] : dk;
    return '<div style="margin-bottom:var(--kt-ai-space-5)"><div class="kt-ai-label" style="margin-bottom:var(--kt-ai-space-3)">' + esc(head) + "</div>" +
      byDay[dk].map(e => {
        const tone = e.tone || "info";
        const edge = toneFg(tone, "var(--kt-ai-border-strong)");
        return '<div class="kt-ai-card kt-ai-hover-lift" style="padding:var(--kt-ai-space-4) var(--kt-ai-space-5);margin-bottom:var(--kt-ai-space-3);border-left:3px solid ' + edge + ';display:flex;gap:var(--kt-ai-space-5);align-items:baseline">' +
          '<span class="kt-ai-num" style="flex-shrink:0;width:88px;font-size:var(--kt-ai-text-xs)">' + esc(e.time || "весь день") + "</span>" +
          '<span style="flex:1;min-width:0"><span style="font-size:var(--kt-ai-text-sm);font-weight:500">' + esc(e.title) + "</span>" +
          (e.note ? '<span class="kt-ai-meta" style="display:block;margin-top:2px">' + esc(e.note) + "</span>" : "") + "</span>" +
          (e.badge ? '<span class="kt-ai-status-pill" data-status="' + esc(tone) + '">' + esc(e.badge) + "</span>" : "") + "</div>";
      }).join("") + "</div>";
  }).join("");
  if (!evs.length) h += '<div class="kt-ai-empty"><span class="title">Событий пока нет</span></div>';
  return h;
}

// map: схема-карта участка – точки (0-100 по обеим осям) со статусами, линии-связи; НЕ геокарта с тайлами
function renderMap() {
  const mp = CFG.map || {};
  const pts = (Array.isArray(mp.points) ? mp.points : []).filter(p => p && p.label != null);
  const toneOf = p => (p.status && statuses[p.status] ? statuses[p.status].tone : p.tone) || "info";
  const fillOf = t => toneFg(t, "var(--kt-ai-fg-muted)");
  const px = v => 40 + (Math.max(0, Math.min(100, +v || 0)) / 100) * 920;   // viewBox 1000x600: подписи рендерятся ~13px
  const py = v => 60 + (Math.max(0, Math.min(100, +v || 0)) / 100) * 480;
  let svg = "";
  (Array.isArray(mp.lines) ? mp.lines : []).forEach(l => {
    const a = pts[l[0]], b = pts[l[1]];
    if (a && b) svg += '<line x1="' + px(a.x).toFixed(1) + '" y1="' + py(a.y).toFixed(1) + '" x2="' + px(b.x).toFixed(1) + '" y2="' + py(b.y).toFixed(1) + '" stroke="var(--kt-ai-border-strong)" stroke-width="4"/>';
  });
  pts.forEach(p => {
    const t = toneOf(p);
    const tx = Math.max(110, Math.min(890, px(p.x)));   // подпись не вылезает за край схемы
    svg += '<circle data-map-pt="true" cx="' + px(p.x).toFixed(1) + '" cy="' + py(p.y).toFixed(1) + '" r="9" fill="' + fillOf(t) + '"' + (t === "risk" ? ' stroke="var(--kt-ai-status-risk-fg)" stroke-opacity="0.35" stroke-width="8"' : "") + "><title>" + esc(p.label + (p.note ? " — " + p.note : "")) + "</title></circle>" +
      '<text x="' + tx.toFixed(1) + '" y="' + (py(p.y) - 18).toFixed(1) + '" text-anchor="middle" font-size="12" fill="var(--kt-ai-fg-muted)">' + esc(p.label) + "</text>";
  });
  const att = pts.filter(p => /warn|risk/.test(toneOf(p)));
  let h = renderHead();
  h += '<div class="kt-ai-card" style="padding:var(--kt-ai-space-6);margin-top:var(--kt-ai-space-6)">' +
    (mp.title ? '<div class="kt-ai-label" style="margin-bottom:var(--kt-ai-space-4)">' + esc(mp.title) + "</div>" : "") +
    '<svg viewBox="0 0 1000 600" style="width:100%;height:auto;display:block;background-image:radial-gradient(var(--kt-ai-border) 0.5px,transparent 0.5px);background-size:8px 8px;border-radius:var(--kt-ai-radius-lg)" role="img" aria-label="' + esc(mp.title || "Схема участка") + '">' + svg + "</svg>" +
    '<div style="display:flex;gap:var(--kt-ai-space-5);margin-top:var(--kt-ai-space-4);flex-wrap:wrap">' +
    [["ok", "в норме"], ["warn", "внимание"], ["risk", "проблема"]].map(l => '<span class="kt-ai-meta" style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:' + fillOf(l[0]) + '"></span>' + l[1] + "</span>").join("") + "</div></div>";
  if (att.length) {
    h += '<div class="kt-ai-h3" style="margin:var(--kt-ai-space-7) 0 var(--kt-ai-space-4)">Требует внимания</div>';
    h += att.map(p => '<div class="kt-ai-banner" data-tone="' + (toneOf(p) === "risk" ? "risk" : "warn") + '" style="margin-bottom:var(--kt-ai-space-3)"><strong>' + esc(p.label) + "</strong>" + (p.note ? " — " + esc(p.note) : "") + "</div>").join("");
  }
  return h;
}

// timeline: хронология дела/инцидента – вертикальная лента событий с акторами и тонами
function renderTimeline() {
  const tl = CFG.timeline || {};
  const evs = (Array.isArray(tl.events) ? tl.events : []).filter(e => e && e.title);
  const dotOf = t => toneFg(t, "var(--kt-ai-fg-faint)");
  let h = renderHead();
  if (tl.title) h += '<div class="kt-ai-h3" style="margin:var(--kt-ai-space-6) 0 var(--kt-ai-space-4)">' + esc(tl.title) + "</div>";
  h += '<div style="max-width:720px;margin-top:var(--kt-ai-space-5)">' + evs.map((e, i) => {
    const last = i === evs.length - 1;
    return '<div style="display:grid;grid-template-columns:96px 20px minmax(0,1fr);gap:var(--kt-ai-space-3)">' +
      '<span class="kt-ai-num" style="font-size:var(--kt-ai-text-xs);color:var(--kt-ai-fg-muted);text-align:right;padding-top:2px">' + esc(e.time || "") + "</span>" +
      '<span style="display:flex;flex-direction:column;align-items:center"><span style="width:10px;height:10px;border-radius:50%;background:' + dotOf(e.tone) + ";margin-top:4px;flex-shrink:0" +
      (e.current ? ";box-shadow:0 0 0 3px var(--kt-ai-bg-active)" : "") + '"></span>' +
      (last ? "" : '<span style="flex:1;width:1px;background:var(--kt-ai-border);margin-top:3px"></span>') + "</span>" +
      '<div style="padding-bottom:' + (last ? "0" : "var(--kt-ai-space-6)") + '">' +
      '<div style="display:flex;gap:var(--kt-ai-space-3);align-items:baseline;flex-wrap:wrap"><span style="font-size:var(--kt-ai-text-sm);font-weight:' + (e.current ? "600" : "500") + '">' + esc(e.title) + "</span>" +
      (e.actor ? '<span class="kt-ai-chip"' + (/агент/i.test(e.actor) ? ' data-ai="true"' : "") + ">" + esc(e.actor) + "</span>" : "") + "</div>" +
      (e.text ? '<div class="kt-ai-meta" style="margin-top:3px;line-height:1.55">' + esc(e.text) + "</div>" : "") + "</div></div>";
  }).join("") + "</div>";
  if (!evs.length) h += '<div class="kt-ai-empty"><span class="title">Событий пока нет</span></div>';
  return h;
}

function mainByLayout() {
  const lay = (CFG.archetype || CFG.layout || "queue");
  if (lay === "queue") return renderMain();
  if (lay === "cockpit") return renderCockpit();
  if (lay === "dashboard") return renderDashboard();
  if (lay === "compare") return renderCompare();
  if (lay === "conversational") return renderConversational();
  if (lay === "custom") return renderCustom();
  if (lay === "document") return renderDocument();
  if (lay === "copilot") return renderCopilot();
  if (lay === "wizard") return renderWizard();
  if (lay === "kanban") return renderKanban();
  if (lay === "inbox") return renderInbox();
  if (lay === "analytics") return renderAnalytics();
  if (lay === "calendar") return renderCalendar();
  if (lay === "map") return renderMap();
  if (lay === "timeline") return renderTimeline();
  // неизвестный / planned архетип → не падаем, выбираем форму под данные
  if (Array.isArray(CFG.sections) && CFG.sections.length) return renderCustom();
  if (CFG.table && CFG.table.rows && CFG.table.rows.length) return renderMain();
  return renderCustom();
}
function attentionFirst() {
  const att = rows.filter(r => statusCol && statuses[r[statusCol]] && /warn|risk/.test(statuses[r[statusCol]].tone || ""));
  return att.length ? att : rows;
}
function plainTable(list) {
  if (!list.length) return '<div class="kt-ai-empty"><span class="title">Пока нет записей</span><span>Здесь появятся объекты, как только агент их обработает</span></div>';
  return '<div class="kt-ai-table-wrap"><table class="kt-ai-table"><thead><tr>' +
    cols.map(c => "<th" + (c.type === "num" ? ' style="text-align:right"' : "") + ">" + esc(c.label) + "</th>").join("") +
    '</tr></thead><tbody>' +
    list.map(r => '<tr onclick="S.open(' + r._i + ')" style="cursor:pointer">' +
      cols.map(c => "<td" + (c.type === "num" ? ' class="num"' : "") + ">" + cellHtml(r, c) + "</td>").join("") + "</tr>").join("") +
    '</tbody></table></div>';
}
const TONE_FG = { ok: "var(--kt-ai-status-ok-fg)", warn: "var(--kt-ai-status-warn-fg)", risk: "var(--kt-ai-status-risk-fg)" };
function toneFg(t, dflt) { return TONE_FG[t] || dflt; }
function bannerHtml(mb) {
  if (!(CFG.banner && CFG.banner.text)) return "";
  return '<div class="kt-ai-banner" data-tone="' + esc(CFG.banner.tone || "info") + '"' + (mb ? ' style="margin-bottom:' + mb + '"' : "") + '>' + esc(CFG.banner.text) + "</div>";
}
function fmtVal(v) {
  // ISO-дата не должна протекать в интерфейс: 2026-07-21 -> 21.07.2026
  const m = String(v == null ? "" : v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + "." + m[2] + "." + m[1] : v;
}
// hint — «из чего считано» (40 знаков: знаменатель, доля, период).
// note — «чем это число НЕ является»: оговорка о поле-источнике. Потолка у неё
// нет и она не прячется под клик: полосу плиток видят все, и оговорка обязана
// стоять там же, где число, иначе её читают не все (см. .kt-ai-kpi .note).
function kpiHtml(k, extra) {
  const long = String(k.value == null ? "" : k.value).length > 12;
  return '<div class="kt-ai-kpi"' + (extra || "") + '><span class="value"' + (long ? ' data-long="true"' : "") + '>' + esc(k.value) + '</span><span class="label">' + esc(k.label) + "</span>" + (k.hint ? '<span class="hint">' + esc(k.hint) + "</span>" : "") + (k.note ? '<span class="note">' + esc(k.note) + "</span>" : "") + "</div>";
}

// Вывод раздела: последний блок экрана, после таблицы. Заголовок необязателен,
// абзацы разделяются пустой строкой — вывод бывает длиннее одной мысли.
function conclusionHtml() {
  const c = CFG.conclusion;
  if (!c || !c.text) return "";
  const абзацы = String(c.text).split(/\n{2,}/).map(t => t.trim()).filter(Boolean);
  return '<section class="kt-ai-conclusion">' +
    (c.title ? '<span class="title">' + esc(c.title) + "</span>" : "") +
    абзацы.map(t => '<span class="text">' + esc(t) + "</span>").join("") + "</section>";
}
function renderHead() {
  const sc = CFG.scenario || {};
  $("pageTitle").textContent = sc.headline || CFG.product.name;
  $("pageSub").textContent = CFG.product.purpose || "";
  let h = "";
  h += bannerHtml("var(--kt-ai-stack-group)");
  if (CFG.kpis && CFG.kpis.length) h += '<div class="kt-ai-kpi-strip" data-cards="true">' + CFG.kpis.map(k => kpiHtml(k)).join("") + "</div>";
  return h;
}
// dashboard: метрики наверху + список «требует внимания» (управление состоянием процесса)
function renderDashboard() {
  const att = rows.filter(r => statusCol && statuses[r[statusCol]] && /warn|risk/.test(statuses[r[statusCol]].tone || ""));
  const db = CFG.dashboard || {};
  const series = Array.isArray(db.series) ? db.series.filter(s => s && Array.isArray(s.points) && s.points.length >= 2) : [];
  if (!series.length) {
    // простой дашборд (без блока dashboard): KPI + список внимания
    return renderHead() +
      '<div class="kt-ai-h3" style="margin:var(--kt-ai-space-8) 0 var(--kt-ai-space-4)">' + (att.length ? "Требует внимания" : "Записи") + "</div>" +
      plainTable(att.length ? att : rows);
  }
  // референс ElevenLabs dashboard: KPI-карточки = табы, выбранная метрика управляет большим чартом
  const sc = CFG.scenario || {};
  $("pageTitle").textContent = sc.headline || CFG.product.name;
  $("pageSub").textContent = CFG.product.purpose || "";
  let h = "";
  if (CFG.banner && CFG.banner.text) {
    const b = CFG.banner;
    const act = b.action ? '<button class="kt-ai-btn" data-size="sm" onclick="' + (b.actionNav != null ? "S.nav(" + b.actionNav + ")" : "S.bannerAction()") + '">' + esc(b.action) + " →</button>" : "";
    h += '<div class="kt-ai-banner" data-tone="' + esc(b.tone || "info") + '" style="margin-bottom:var(--kt-ai-stack-group);display:flex;align-items:center;gap:var(--kt-ai-space-5)"><span style="flex:1;min-width:0">' + esc(b.text) + "</span>" + act + "</div>";
  }
  // KPI-табы: series[i].kpi — индекс метрики в CFG.kpis (по умолчанию i)
  const kpis = Array.isArray(CFG.kpis) ? CFG.kpis : [];
  const kpiToSeries = {};
  series.forEach((s, si) => { const ki = s.kpi != null ? +s.kpi : si; if (kpiToSeries[ki] == null && kpis[ki]) kpiToSeries[ki] = si; });
  if (state.dashKpi == null || kpiToSeries[state.dashKpi] == null) state.dashKpi = +Object.keys(kpiToSeries)[0];
  h += '<div class="kt-ai-kpi-strip" data-cards="true">' + kpis.map((k, ki) => {
    const clickable = kpiToSeries[ki] != null, active = clickable && ki === state.dashKpi;
    return kpiHtml(k, clickable ? ' data-tab="true" data-active="' + active + '" role="tab" aria-selected="' + active + '" tabindex="0" onclick="S.dashKpi(' + ki + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();S.dashKpi(' + ki + ')}"' : "");
  }).join("") + "</div>";
  const cur = series[kpiToSeries[state.dashKpi]];
  // без дубля цифры: значение уже на выбранной KPI-карточке (референс ElevenLabs)
  h += '<section class="kt-ai-chart-card"><div class="cc-head"><div><div class="cc-title">' + esc(cur.title || (kpis[state.dashKpi] || {}).label || "") + "</div></div>" +
    (db.range ? '<span class="kt-ai-meta">' + esc(db.range) + "</span>" : "") + "</div>" +
    lineChartSvg(cur.points, { W: 1160, H: 290, color: "var(--kt-ai-chart-blue)", unit: cur.unit, title: cur.title }) +
    (cur.note ? '<div class="kt-ai-meta" style="margin-top:var(--kt-ai-space-4)">' + esc(cur.note) + "</div>" : "") + "</section>";
  // нижняя сетка разборов: cards (мини-карточки статистики) / share (доли с процент-барами) / top (топ-N с баром за подписью)
  const brs = Array.isArray(db.breakdowns) ? db.breakdowns : [];
  if (brs.length) h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:var(--kt-ai-space-6)">' + brs.map(br => {
    const items = Array.isArray(br.items) ? br.items : [];
    let body = "";
    if (br.type === "cards") {
      body = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--kt-ai-space-4)">' + items.map(it =>
        '<div style="border:1px solid var(--kt-ai-border);border-radius:var(--kt-ai-radius-lg);padding:var(--kt-ai-space-4)">' +
        '<div style="font-size:var(--kt-ai-text-sm);font-weight:500;margin-bottom:var(--kt-ai-space-3)">' + esc(it.title) + "</div>" +
        (Array.isArray(it.stats) ? it.stats : []).map(st => '<div style="display:flex;justify-content:space-between;gap:var(--kt-ai-space-3);padding:2px 0;font-size:var(--kt-ai-text-xs)"><span class="kt-ai-meta">' + esc(st.label) + '</span><span class="kt-ai-num">' + esc(st.value) + "</span></div>").join("") + "</div>").join("") + "</div>";
    } else if (br.type === "share") {
      const total = items.reduce((a, b) => a + (+b.value || 0), 0) || 1;
      body = items.map(it => {
        const pct = Math.round((+it.value || 0) / total * 100);
        return '<div class="kt-ai-row-hover" style="display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:var(--kt-ai-space-3);align-items:center;padding:4px 0;font-size:var(--kt-ai-text-xs)">' +
          '<span style="line-height:1.3">' + esc(it.label) + "</span>" +
          '<span style="height:7px;border-radius:4px;background:var(--kt-ai-bg-soft);overflow:hidden;display:block"><span style="display:block;height:100%;border-radius:4px;width:' + pct + '%;background:var(--kt-ai-primary)"></span></span>' +
          '<span class="kt-ai-num" style="text-align:right">' + pct + "%</span></div>";
      }).join("");
    } else {  // top: бар-трек за подписью, значение справа (референс «Top called paths»)
      const max = Math.max(1, ...items.map(it => +it.value || 0));
      body = items.map(it =>
        '<div class="kt-ai-row-hover" style="display:flex;align-items:center;gap:var(--kt-ai-space-3);padding:3px 0;font-size:var(--kt-ai-text-xs)">' +
        '<span style="flex:1;position:relative;border-radius:var(--kt-ai-radius-sm);overflow:hidden;padding:4px 8px;background:var(--kt-ai-bg)">' +
        '<span style="position:absolute;inset:0;width:' + Math.round((+it.value || 0) / max * 100) + '%;background:var(--kt-ai-bg-soft);border-radius:var(--kt-ai-radius-sm)"></span>' +
        '<span style="position:relative">' + esc(it.label) + "</span></span>" +
        '<span class="kt-ai-num" style="width:56px;text-align:right">' + esc(it.value) + (br.unit ? ' <span class="kt-ai-meta">' + esc(br.unit) + "</span>" : "") + "</span></div>").join("");
    }
    return '<section class="kt-ai-chart-card" style="margin-bottom:0"><div class="cc-head"><div class="cc-title">' + esc(br.title) + "</div></div>" + body +
      (br.note ? '<div class="kt-ai-meta" style="margin-top:var(--kt-ai-space-4)">' + esc(br.note) + "</div>" : "") + "</section>";
  }).join("") + "</div>";
  if (att.length) {
    const regIdx = (CFG.nav || []).findIndex(n => n && n.view === "registry");
    h += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin:var(--kt-ai-space-8) 0 var(--kt-ai-space-4)"><div class="kt-ai-h3">Требует внимания</div>' +
      (regIdx > 0 ? '<button class="cc-link" type="button" onclick="S.nav(' + regIdx + ')">' + esc((CFG.nav[regIdx] || {}).label || "Все записи") + " →</button>" : "") + "</div>" +
      plainTable(att.slice(0, 5));
    if (att.length > 5 && regIdx > 0) h += '<div class="kt-ai-meta" style="margin-top:var(--kt-ai-space-3)">Ещё ' + (att.length - 5) + ' — в разделе «' + esc((CFG.nav[regIdx] || {}).label) + "»</div>";
  }
  return h;
}
S.dashKpi = ki => { state.dashKpi = ki; render(); };
// cockpit: один фокусный объект с сигналами и решением + компактная очередь сбоку (мониторинг/исключения)
function renderCockpit() {

// compare: сверка двух источников по парам полей, расхождения подсвечены (аудит/финансы/договоры)
function renderCompare() {
  const sc = CFG.scenario || {}, d = CFG.drawer || {}, cmp = CFG.compare || {};
  const pairs = Array.isArray(cmp.pairs) ? cmp.pairs : [];
  if (!pairs.length) return renderMain();   // защита: нет пар → надёжная очередь
  const focal = rows[state.focusRow] || attentionFirst()[0] || rows[0];
  let html = renderHead();
  if (!focal) return html + '<div class="kt-ai-empty"><span class="title">Пока нет объектов для сверки</span></div>';
  const mism = p => String(focal[p.a] ?? "") !== String(focal[p.b] ?? "");
  // в узких панелях сверки поле стопкой (метка над значением) – фикс. ширина .kt-ai-prop тут ломает перенос
  const panel = (label, side) => '<div class="kt-ai-card" style="padding:var(--kt-ai-space-6)"><div class="kt-ai-label" style="margin-bottom:var(--kt-ai-space-4)">' + esc(label) + "</div>" +
    pairs.map(p => '<div style="padding:6px 8px;border-radius:var(--kt-ai-radius-md);margin-bottom:2px' + (mism(p) ? ';background:var(--kt-ai-status-warn-bg)' : '') + '">' +
      '<div class="kt-ai-meta" style="font-size:var(--kt-ai-text-2xs)">' + esc(p.label) + '</div>' +
      '<div style="font-size:var(--kt-ai-text-sm);margin-top:1px">' + esc(fmtVal(focal[side === "a" ? p.a : p.b]) ?? "–") + '</div></div>').join("") + "</div>";
  const flags = focal._flags || [];
  html += '<div style="display:grid;grid-template-columns:230px minmax(0,1fr);gap:var(--kt-ai-space-6);margin-top:var(--kt-ai-space-6)">';
  html += '<div><div class="kt-ai-label" style="margin-bottom:var(--kt-ai-space-3)">Объекты сверки</div>' +
    rows.map(r => '<div class="kt-ai-nav-item" onclick="S.compareFocus(' + r._i + ')" style="cursor:pointer;justify-content:space-between;gap:var(--kt-ai-space-3)' + (r._i === focal._i ? ";background:var(--kt-ai-bg-active)" : "") + '"><span class="kt-ai-truncate">' + esc(r[d.titleKey || cols[0].key]) + "</span>" + (statusCol ? statusTag(r[statusCol]) : "") + "</div>").join("") + "</div>";
  html += '<div><div class="kt-ai-h2" style="margin-bottom:var(--kt-ai-space-4)">' + esc(focal[d.titleKey || cols[0].key]) + "</div>" +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--kt-ai-space-4)">' + panel(cmp.aLabel || "Источник A", "a") + panel(cmp.bLabel || "Источник B", "b") + "</div>" +
    (flags.length ? '<div class="kt-ai-label" style="margin-top:var(--kt-ai-space-5)">' + esc(d.flagsLabel || "Расхождения") + "</div>" + flags.map(f => '<div class="kt-ai-banner" data-tone="warn" style="margin-top:var(--kt-ai-space-2)">' + esc(f) + "</div>").join("") : "") +
    '<div class="drawer-actions"><button class="kt-ai-btn" data-variant="primary" onclick="state.openRow=' + focal._i + ';S.askApprove()">' + esc(sc.control || "Подтвердить") + "</button>" +
    (sc.reject ? '<button class="kt-ai-btn" onclick="state.openRow=' + focal._i + ';S.reject()">' + esc(sc.reject) + "</button>" : "") +
    "</div></div>";
  return html + "</div>";
}

// conversational: чат как главная рабочая область (референс ElevenLabs Conversational AI).
// Орб-аватар ассистента, ответ без пузыря, подсказки, prompt-bar снизу. Переиспользует S.aiAsk.
function renderConversational() {
  const ai = CFG.ai || {}, sc = CFG.scenario || {};

  h += '<div class="kt-ai-chat" id="convChat" data-fill="true" role="log" aria-live="polite" aria-label="Диалог с агентом" style="display:none"></div>';
  // подсказки + композер: единый док, который переезжает из hero-центра вниз
  let dock = '<div id="convDock" style="display:flex;flex-direction:column;gap:var(--kt-ai-space-3);width:100%;max-width:680px;margin:0 auto">';
  if (ai.suggestions && ai.suggestions.length)
    dock += '<div class="kt-ai-suggestions" style="justify-content:center">' +
