  dock += '<div class="kt-ai-prompt-bar"><textarea rows="1" id="convInput" aria-label="Сообщение агенту" placeholder="Спросить агента…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();S.aiAsk(this.value,\'convChat\');this.value=\'\'}"></textarea>' +
    '<button class="kt-ai-prompt-send" aria-label="Отправить" onclick="var i=document.getElementById(\'convInput\');S.aiAsk(i.value,\'convChat\');i.value=\'\'"><svg class="kt-icon"><use href="#send"></use></svg></button></div>' +
    '<span class="kt-ai-gen-label" style="text-align:center">Сгенерировано ИИ</span></div>';
  // hero: приветствие без пузыря, всё одной центрированной группой (паттерн пустого чата)
  h += '<div id="convHero" style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--kt-ai-space-7)">' +
    '<span aria-hidden="true" style="width:44px;height:44px;border-radius:50%;background:var(--kt-ai-ai-orb)"></span>' +
    '<div style="max-width:560px;text-align:center;font-size:var(--kt-ai-text-md);line-height:1.65">' + esc(ai.intro || "Здравствуйте! Чем могу помочь?") + "</div>" +
    dock + "</div>";
  return h + "</div>";
}

// custom: запасной архетип для экранов, не подходящих под другие (референс ElevenLabs settings-detail).
// Свободная компоновка из секций-карточек по контракту CFG.sections. Никогда не форсит таблицу.
function renderCustom() {
  const sc = CFG.scenario || {};
  $("pageTitle").textContent = sc.headline || CFG.product.name;
  $("pageSub").textContent = CFG.product.purpose || "";
  const sections = Array.isArray(CFG.sections) ? CFG.sections : [];
  // Ширину называет ПРОДУКТ, а не подбор типов секций. Мера для чтения
  // сплошного текста (720px) разумна, но секция `fields` — не сплошной текст, а
  // пары «подпись — значение»: таблица критериев с доказательствами на 720px
  // читается хуже, чем на общей ширине, и экран выглядел съехавшим к центру,
  // потому что заголовок оставался во всю ширину. Раньше продукт добивался
  // нужной ширины, подбирая типы секций, — это подбор, а не решение.
  //   "width": "full"    — общая ширина (по умолчанию для любой не-текстовой секции)
  //   "width": "reading" — мера чтения, ~720px
  const автоШирина = sections.some(s => s && ((s.type && s.type !== "text") || (s.fields && s.fields.length))) ? "full" : "reading";
  const wide = (CFG.width || автоШирина) === "full";
  let h = '<div style="max-width:' + (wide ? "1080px" : "720px") + ';margin:0 auto">' + renderHead();
  if (!sections.length) {
    h += '<div class="kt-ai-card" style="margin-top:var(--kt-ai-space-6)"><div class="kt-ai-empty">' +
      '<div class="icon-spot"><svg class="kt-icon kt-icon-lg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg></div>' +
      '<span class="title">Экран ещё не наполнен</span><span>Опишите разделы в contract.sections — они появятся карточками здесь</span></div></div>';
  } else {
    // композиция: каждая секция — блок из примитивов системы; half-секции встают в две колонки
    const block = s => {
      const head = '<div class="kt-ai-h3">' + esc(s.title || "") + "</div>" +
        (s.description ? '<div class="kt-ai-meta" style="margin-top:2px;margin-bottom:var(--kt-ai-space-4)">' + esc(s.description) + "</div>" : '<div style="margin-bottom:var(--kt-ai-space-4)"></div>');
      if (s.type === "kpis") return head + (CFG.kpis && CFG.kpis.length ? '<div class="kt-ai-kpi-strip" data-cards="true">' + CFG.kpis.map(k => kpiHtml(k)).join("") + "</div>" : "");
      if (s.type === "chart" && s.chart) return head + analyticsChartCard(s.chart, 0);
      if (s.type === "table") return head + plainTable(rows);
      if (s.type === "chat") { const ai = CFG.ai || {}; return head + '<div class="kt-ai-chat" data-scroll="true" id="secChat">' + msgHtml("assistant", ai.intro || "Чем помочь?") + "</div>" +
        (ai.suggestions && ai.suggestions.length ? '<div class="kt-ai-suggestions" style="margin-top:var(--kt-ai-space-3)">' + ai.suggestions.map(x => '<button class="kt-ai-suggestion" onclick="S.aiAsk(this.textContent,\'secChat\')">' + esc(x) + "</button>").join("") + "</div>" : ""); }
      if (s.type === "cards") return head + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--kt-ai-space-4)">' +
        (s.items || []).map(it => '<div class="kt-ai-card kt-ai-hover-lift" role="button" tabindex="0" onclick="toast(\'' + esc(it.title) + ' – заглушка прототипа\',\'\')" onkeydown="if(event.key===\'Enter\')this.click()" style="cursor:pointer;padding:var(--kt-ai-space-5)">' +
          '<div style="display:flex;justify-content:space-between;gap:var(--kt-ai-space-3);align-items:baseline"><span style="font-size:var(--kt-ai-text-sm);font-weight:500">' + esc(it.title) + "</span>" +
          (it.badge ? '<span class="kt-ai-status-pill" data-status="' + esc(it.tone || "info") + '">' + esc(it.badge) + "</span>" : "") + "</div>" +
          (it.text ? '<div class="kt-ai-meta" style="margin-top:var(--kt-ai-space-2);line-height:1.45">' + esc(it.text) + "</div>" : "") + "</div>").join("") + "</div>";
      return head +
        (s.body ? '<div style="font-size:var(--kt-ai-text-sm);white-space:pre-wrap;line-height:var(--kt-ai-leading-normal)">' + esc(s.body) + "</div>" : "") +
        (Array.isArray(s.fields) && s.fields.length ? s.fields.map(f => '<div class="kt-ai-prop"><span class="k">' + esc(f.label) + '</span><span class="v">' + esc(f.value ?? "–") + "</span></div>").join("") : "");
    };
    h += '<div class="kt-ai-cols" style="grid-template-columns:1fr 1fr;margin-top:var(--kt-ai-space-5)">' +
      sections.map(s => '<div class="kt-ai-card" style="padding:var(--kt-ai-space-7)' + (s.width === "half" ? "" : ";grid-column:1 / -1") + '">' + block(s) + "</div>").join("") + "</div>";
  }
  if (sc.control) h += '<div style="margin-top:var(--kt-ai-space-6);display:flex;gap:var(--kt-ai-space-4)">' +
    '<button class="kt-ai-btn" data-variant="primary" onclick="S.customAction()">' + esc(sc.control) + "</button>" +
    (sc.reject ? '<button class="kt-ai-btn" onclick="S.customAction()">' + esc(sc.reject) + "</button>" : "") + "</div>";
  return h + "</div>";
}
S.customAction = () => toast(((CFG.scenario || {}).control || "Готово") + " – выполнено", "ok");

// Hero (ElevenLabs): имя РАЗДЕЛА слева + подпись, главное действие справа. Лого — только в sidebar.
function pageHero(title, sub, action) {
  return '<header class="page-hero"><div class="ph-text"><h1>' + esc(title) + "</h1>" +
    (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") + "</div>" +
    (action ? '<div class="ph-action">' + action + "</div>" : "") + "</header>";
}
function render() {
  const main = state.navIndex === 0;
  const sc = CFG.scenario || {};
  const archetype = CFG.archetype || CFG.layout || "queue";
  const chatFill = main && archetype === "conversational";   // чат сам владеет областью (без page-hero, как в React fillBody)
  const navItem = (CFG.nav || [])[state.navIndex] || {};
  const isDocs = !main && navItem.view === "documents";       // секция-коллекция документов (с возможностью скачать)
  const isRegistry = !main && navItem.view === "registry" && CFG.table && (CFG.table.rows || []).length;  // полный реестр (главная — только обзор)
  const title = main ? (sc.headline || CFG.product.name) : navItem.label;
  const sub = (main || isDocs || isRegistry) ? (CFG.product.purpose || "") : "";
  const action = (main || isRegistry) ? '<button class="kt-ai-btn" data-variant="primary" onclick="S.newCase()"><svg class="kt-icon kt-icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>' + esc(createLabel) + "</button>" : "";
  const showHero = (main && !chatFill) || isDocs || isRegistry;
  const body = main ? mainByLayout() : (isRegistry ? renderMain() : (isDocs ? renderDocs(navItem) : renderStub(navItem.label)));
  // Вывод — последний блок экрана: он читается после данных, а не вместо них.
  // Место одно на все архетипы, поэтому дописывается здесь, а не в каждом теле.
  // Чат владеет всей областью сам (chatFill) — там дописывать некуда.
  const вывод = (main && !chatFill) || isRegistry ? conclusionHtml() : "";
  $("view").innerHTML = (showHero ? pageHero(title, sub, (main || isRegistry) ? action : "") : "") + body + вывод;
  $("pageTitle").textContent = title; $("pageSub").textContent = sub;
  const top = $("topSearch"); if (top && top.value !== state.query) top.value = state.query;  // топбар-поиск держит state.query
}
S.compareFocus = i => { state.focusRow = i; render(); };
// загрузочное состояние (ДС: лоадеры на всём, что дольше 300мс) – показываем один раз при гидрации
function renderSkeleton() {
  return '<div style="margin-top:var(--kt-ai-space-8)">' +
    '<div class="kt-ai-skeleton" style="height:28px;width:240px;margin-bottom:var(--kt-ai-space-6)"></div>' +
    '<div class="kt-ai-table-wrap">' +
    Array.from({ length: 6 }).map(() => '<div class="kt-ai-skeleton" style="height:44px;margin:var(--kt-ai-space-2) 0"></div>').join("") +
    "</div></div>";
}

/* ---------- Drawer записи ---------- */
// Карточка кейса: что сделал агент (анализ + признаки) + что решает человек (рекомендация, изменяемое действие)
S.open = i => {
  const r = rows[i]; if (!r) return;
  state.openRow = i;
  const d = CFG.drawer || {}; const sc = CFG.scenario || {};
  const flags = r._flags || [];
  const recs = flags.filter(f => /^рекоменд/i.test(f));
  const signals = flags.filter(f => !/^рекоменд/i.test(f));
  const recText = recs.length ? recs[0].replace(/^Рекомендация:\s*/i, "") : "";
  const acts = Array.isArray(sc.actions) ? sc.actions : [];
  const preIdx = Math.max(0, acts.findIndex(a => recText && recText.toLowerCase().startsWith(a.toLowerCase().split(/[\s(/]/)[0])));
  const fields = (d.fields || []).map(f => '<div class="kt-ai-prop"><span class="k">' + esc(f.label) + '</span><span class="v">' + esc(fmtVal(r[f.key]) ?? "–") + "</span></div>").join("");

  let h = '<div class="drawer-head"><div class="t"><div class="kt-ai-h2" id="drawerTitle">' + esc(r[d.titleKey || cols[0].key]) + "</div>" +
    '<div style="margin-top:6px">' + (statusCol ? statusTag(r[statusCol]) : "") + "</div></div>" +
    '<button class="kt-ai-icon-button" aria-label="Закрыть" onclick="S.close()"><svg class="kt-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';

  h += '<div class="drawer-sec">' +
    (sc.aiSummary ? '<div class="kt-ai-gen-label">Что сделал агент</div><p class="agent-summary">' + esc(sc.aiSummary) + "</p>" : "") +
    fields + "</div>";

  const docs = Array.isArray(r._docs) ? r._docs : [];
  if (docs.length) h += '<div class="drawer-sec"><div class="kt-ai-label">Документы</div><div class="kt-ai-doc-list" style="margin-top:var(--kt-ai-space-3)">' +
    docs.map(dd => docCard(dd, "")).join("") + "</div></div>";

  if (signals.length) h += '<div class="drawer-sec"><div class="kt-ai-label">' + esc(d.flagsLabel || "Признаки риска") + "</div>" +
    signals.map(f => '<div class="agent-signal"><svg class="kt-icon kt-icon-sm" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span>' + esc(f) + "</span></div>").join("") + "</div>";

  h += '<div class="drawer-sec decision"><div class="kt-ai-label">Решение</div>';
  if (recText) h += '<div class="rec-box"><span class="kt-ai-gen-label" style="margin-bottom:6px">Рекомендация агента</span>' + esc(recText) + "</div>";
  if (acts.length) h += '<div class="kt-ai-field" style="margin-top:var(--kt-ai-space-5)"><label for="recSelect">Действие — можно изменить</label>' +
    '<select class="kt-ai-select" id="recSelect">' + acts.map((a, idx) => "<option" + (idx === preIdx ? " selected" : "") + ">" + esc(a) + "</option>").join("") + "</select></div>";
  h += '<div class="drawer-actions">' +
    '<button class="kt-ai-btn" data-variant="primary" onclick="S.askApprove()">' + esc(sc.control || "Подтвердить") + "</button>" +
    (sc.reject ? '<button class="kt-ai-btn" onclick="S.reject()">' + esc(sc.reject) + "</button>" : "") +
    "</div></div>";

  const dr = $("drawer");
  dr.innerHTML = h;
  dr.style.display = "block";
  state._drawerReturn = document.activeElement;
  dr.onkeydown = e => { if (e.key === "Escape") { e.stopPropagation(); S.close(); } };
  dr.focus();
};
S.bannerAction = () => toast("Открываю связанный пакет работ", "");
S.close = () => { $("drawer").style.display = "none"; state.openRow = -1; const p = state._drawerReturn; if (p && p.focus) p.focus(); };
// Row-actions (ElevenLabs): kebab на hover ряда → быстрые действия
S.rowMenu = (i, e) => {
  e.stopPropagation();
  const sc = CFG.scenario || {};
  const m = $("rowMenu");
  m.innerHTML =
    '<button role="menuitem" class="item" onclick="S.closeMenus();S.open(' + i + ')"><svg class="kt-icon kt-icon-sm" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14L21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>Открыть</button>' +
    (sc.control ? '<button role="menuitem" class="item" onclick="S.closeMenus();S.quickApprove(' + i + ')"><svg class="kt-icon kt-icon-sm" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>' + esc(sc.control) + '</button>' : '') +
    (sc.reject ? '<button role="menuitem" class="item" data-danger="true" onclick="S.closeMenus();S.quickReject(' + i + ')"><svg class="kt-icon kt-icon-sm" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>' + esc(sc.reject) + '</button>' : '');
  const b = e.target.closest("button").getBoundingClientRect();
  S.closeMenus();
  m.style.top = (b.bottom + 4) + "px";
  m.style.left = Math.max(8, Math.min(b.right - 200, window.innerWidth - 220)) + "px";
  m.dataset.open = "true";
};
S.quickApprove = i => { const sc = CFG.scenario || {}; const r = rows[i]; if (r && statusCol && sc.approveTo) r[statusCol] = sc.approveTo; render(); toast((sc.control || "Подтверждено") + " – выполнено", "ok"); };
S.quickReject = i => { const sc = CFG.scenario || {}; const r = rows[i]; if (r && statusCol && sc.rejectTo) r[statusCol] = sc.rejectTo; render(); toast(sc.reject || "Возвращено", "warn"); };

/* ---------- Контрольное действие (подтверждение модалкой) ---------- */
S.askApprove = () => {
  const sc = CFG.scenario || {};
  $("modal").innerHTML = '<div class="kt-ai-modal" role="dialog" aria-modal="true" aria-label="Подтверждение действия"><div class="modal-title">' + esc(sc.control || "Подтвердить") + "?</div>" +
    '<div class="kt-ai-meta">' + esc(sc.confirmText || "Действие будет зафиксировано.") + "</div>" +
    '<div class="modal-actions"><button class="kt-ai-btn" onclick="S.closeModal()">Отмена</button>' +
    '<button class="kt-ai-btn" data-variant="primary" onclick="S.approve()">' + esc(sc.control || "Подтвердить") + "</button></div></div>";
  $("modal").style.display = "flex";
};
S.closeModal = () => { $("modal").style.display = "none"; };
S.approve = () => {
  const sc = CFG.scenario || {};
  const r = rows[state.openRow];
  const sel = $("recSelect");
  const act = sel ? sel.value : "";
  if (r && statusCol && sc.approveTo) r[statusCol] = sc.approveTo;
  S.closeModal(); S.close(); render();
  toast(act ? ("Действие назначено: " + act) : ((sc.control || "Подтверждено") + " – выполнено"), "ok");
};
S.reject = () => {
  const sc = CFG.scenario || {};
  const r = rows[state.openRow];
  if (r && statusCol && sc.rejectTo) r[statusCol] = sc.rejectTo;
  S.close(); render();
  toast(sc.reject || "Возвращено", "warn");
};
S.bulkApprove = () => {
  const sc = CFG.scenario || {};
  rows.forEach(r => { if (state.selected.has(r._i) && statusCol && sc.approveTo) r[statusCol] = sc.approveTo; });
  const n = state.selected.size; state.selected.clear(); render();
  toast(n + " записей: " + (sc.control || "подтверждено"), "ok");
};

/* ---------- Список ---------- */
S.nav = i => { state.navIndex = i; renderNav(); render(); };
S.filter = k => { state.statusFilter = k; state.page = 1; render(); };
S.sel = (i, on) => { if (on) state.selected.add(i); else state.selected.delete(i); render(); };
S.clearSel = () => { state.selected.clear(); render(); };
S.toggleSidebar = () => { const sb = $("sidebar"); sb.dataset.open = sb.dataset.open === "true" ? "false" : "true"; };

/* ---------- AI-панель ---------- */
let aiOpen = false;
S.toggleAi = () => { aiOpen = !aiOpen; $("aiPanel").style.display = aiOpen ? "flex" : "none"; $("aiFab").style.display = aiOpen ? "none" : "flex"; if (aiOpen) renderAi(); };
// Правая панель «Активность» — лента действий агента/истории решений (референс из видео Kole Jain)
S.toggleActivity = () => {
  const p = $("actPanel");
  if (p.style.display !== "none") { p.style.display = "none"; return; }
  const tone = t => t === "info" ? "var(--kt-ai-status-info-fg)" : toneFg(t, "var(--kt-ai-fg-faint)");
  const items = CFG.activity || [];
  p.innerHTML = '<div class="act-head"><strong>Активность</strong><button class="kt-ai-icon-button" aria-label="Закрыть" onclick="S.toggleActivity()"><svg class="kt-icon"><use href="#x"></use></svg></button></div>' +
    '<div class="kt-ai-activity">' + items.map(a =>
      '<div class="act-item"><span class="act-dot" style="background:' + tone(a.tone) + '"></span>' +
      '<div class="act-title">' + esc(a.title || "") + "</div>" +
      '<div class="act-time">' + esc([a.time, a.ago].filter(Boolean).join(" · ")) + "</div>" +
      ((a.who || (a.tags && a.tags.length) || a.summary || a.link) ?
        '<div class="act-card">' +
        (a.who ? '<div class="act-row"><span class="k">Кто</span><span class="v">' + esc(a.who) + "</span></div>" : "") +
        (a.tags && a.tags.length ? '<div class="act-row"><span class="k">Данные</span><span class="v">' + a.tags.map(t => '<span class="kt-ai-chip">' + esc(t) + "</span>").join("") + "</span></div>" : "") +
        (a.summary ? '<div class="act-summary">' + esc(a.summary) + "</div>" : "") +
        (a.link ? '<button class="kt-ai-btn" data-size="sm" data-variant="ghost" onclick="toast(\'' + esc(a.link) + " – заглушка','')\">" + esc(a.link) + ' →</button>' : "") +
        "</div>" : "") +
      "</div>").join("") + "</div>";
  p.style.display = "block";
};
function renderAi() {
  const ai = CFG.ai || {};
  $("aiPanel").innerHTML =
    '<div class="drawer-head"><div class="t kt-ai-h2">Ассистент</div>' +
    '<button class="kt-ai-icon-button" aria-label="Закрыть" onclick="S.toggleAi()"><svg class="kt-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>' +
    '<div class="kt-ai-chat" id="aiChat">' + msgHtml("assistant", ai.intro || "Чем помочь?") + "</div>" +
    '<div class="ai-panel-foot">' +
    '<div class="kt-ai-suggestions">' + (ai.suggestions || []).map(s => '<button class="kt-ai-suggestion" onclick="S.aiAsk(this.textContent)">' + esc(s) + "</button>").join("") + "</div>" +
    '<div class="kt-ai-prompt-bar"><textarea rows="1" id="aiInput" placeholder="Спросить…" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();S.aiAsk(this.value);this.value=\'\'}"></textarea>' +
    '<button class="kt-ai-prompt-send" aria-label="Отправить" onclick="var i=document.getElementById(\'aiInput\');S.aiAsk(i.value);i.value=\'\'"><svg class="kt-icon" viewBox="0 0 24 24"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg></button></div>' +
    '<span class="kt-ai-gen-label">Сгенерировано ИИ</span></div>';
}
function msgHtml(role, text, streaming) {
  if (role === "user") return '<div class="kt-ai-msg" data-role="user"><div class="body">' + esc(text) + "</div></div>";
  return '<div class="kt-ai-msg" data-role="assistant"' + (streaming ? ' data-streaming="true"' : "") + ' style="align-items:flex-start">' +
    '<span class="msg-orb" aria-hidden="true"></span><div class="body">' + esc(text) + "</div></div>";
}
S.aiAsk = (q, chatId) => {
  q = (q || "").trim(); if (!q) return;
  const ai = CFG.ai || {};
  const chat = $(chatId || "aiChat");
  if (!chat) return;
  const hero = document.getElementById("convHero");
  if (hero && chatId === "convChat") {   // первый вопрос: hero складывается – интро становится первым сообщением, док уезжает вниз
    chat.style.display = "";
    chat.insertAdjacentHTML("beforeend", msgHtml("assistant", (CFG.ai || {}).intro || "Здравствуйте! Чем могу помочь?"));
    const dock = document.getElementById("convDock");
    if (dock) hero.parentElement.appendChild(dock);
    hero.remove();
  }
  chat.insertAdjacentHTML("beforeend", msgHtml("user", q));
  const a = (ai.answers || {})[q] || ai.fallback || "Ответ-заглушка прототипа.";
  chat.insertAdjacentHTML("beforeend", msgHtml("assistant", "", true));
  const msg = chat.lastElementChild, body = msg.querySelector(".body");
  let i = 0;
  const t = setInterval(() => {
    body.textContent = a.slice(0, i += 4);
    chat.scrollTop = chat.scrollHeight;
    if (i >= a.length) { clearInterval(t); msg.dataset.streaming = ""; }
  }, 16);
  chat.scrollTop = chat.scrollHeight;
};

/* ---------- Топбар ---------- */
function toast(text, tone) {
  const d = document.createElement("div");
  d.className = "kt-ai-toast"; d.dataset.tone = tone || "";
  d.textContent = text;
  $("toasts").appendChild(d);
  setTimeout(() => d.remove(), 3500);
}
$("topSearch").addEventListener("input", e => { state.query = e.target.value; state.page = 1; render(); });
$("themeToggle").onclick = () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  $("themeToggle").dataset.mode = next;
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { S.close(); S.closeModal(); S.closeMenus(); if (aiOpen) S.toggleAi(); }
  // Сочетание и его подпись включаются вместе: выключил подпись — выключено и
  // сочетание, иначе в продукте живёт незаявленная горячая клавиша.
  if ((CFG.search || {}).shortcut !== false &&
      (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("topSearch").focus(); }
});

renderTop(); renderNav();
$("view").innerHTML = renderSkeleton();
setTimeout(render, 400);
setTimeout(S.maybeOnboarding, 900);
</script>
<!-- Режим обратной связи прототипа (DoD #6): владелец кликает по элементу и оставляет заметку → экспорт в markdown для БА. Самодостаточен, грузится тихо. -->
<script data-kt-ai-boot="js">
// async = false — вставленный скриптом <script> иначе выполняется в порядке
// загрузки, а не вставки. Файлы независимы, но порядок в прототипе должен быть
// воспроизводимым: иначе «иногда работает» отлаживают в продукте, а не здесь.
["kt-ai-orb.js", "kt-ai-chart-tip.js", "kt-ai-composer.js", "kt-ai-feedback.js"].forEach(function (файл) {
  var тег = document.createElement("script");
  тег.src = window.ktAiAsset(файл);
  тег.async = false;
  document.body.appendChild(тег);
});
</script>
</body>
</html>
